<form class="order-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="row two">
    <label>
      <span>Cliente</span>
      <input formControlName="clientId" type="text" maxlength="20" autocomplete="off" placeholder="CLI-0142" />
      @if (errorOf(form.controls.clientId); as message) { <small class="field-error">{{ message }}</small> }
    </label>
    <label>
      <span>Patente</span>
      <input formControlName="licensePlate" type="text" maxlength="7" autocomplete="off" placeholder="BRTC63" />
      @if (errorOf(form.controls.licensePlate, 'plate'); as message) { <small class="field-error">{{ message }}</small> }
    </label>
  </div>
  <label>
    <span>Descripción del trabajo <em>(opcional)</em></span>
    <input formControlName="description" type="text" maxlength="200" autocomplete="off" placeholder="Cambio de pastillas de freno delanteras" />
    @if (errorOf(form.controls.description); as message) { <small class="field-error">{{ message }}</small> }
  </label>

  <fieldset formArrayName="items">
    <legend>Repuestos y mano de obra</legend>
    @for (item of items.controls; track item; let i = $index) {
      <div class="row item" [formGroupName]="i">
        <label class="concept">
          <span>Concepto</span>
          <input formControlName="concept" type="text" maxlength="40" autocomplete="off" placeholder="Pastillas de freno delanteras" />
          @if (errorOf(item.controls.concept); as message) { <small class="field-error">{{ message }}</small> }
        </label>
        <label>
          <span>Cantidad</span>
          <input formControlName="quantity" type="number" min="0.01" max="1000" step="0.01" inputmode="decimal" />
          @if (errorOf(item.controls.quantity, 'quantity'); as message) { <small class="field-error">{{ message }}</small> }
        </label>
        <label>
          <span>Precio unitario (CLP)</span>
          <input formControlName="unitPrice" type="number" min="0" max="10000000" step="1" inputmode="numeric" />
          @if (errorOf(item.controls.unitPrice, 'price'); as message) { <small class="field-error">{{ message }}</small> }
        </label>
        <div class="line-total">
          <span>Subtotal</span>
          <strong>{{ formatClp(subtotals()[i] ?? 0) }}</strong>
        </div>
        <button class="button secondary compact" type="button" (click)="removeItem(i)" [disabled]="items.length === 1" [attr.aria-label]="'Quitar el renglón ' + (i + 1)">Quitar</button>
      </div>
    }
    <button class="button secondary compact" type="button" (click)="addItem()" [disabled]="items.length >= maxItems">Agregar renglón</button>
  </fieldset>

  <div class="submit-row">
    <p class="total">Total de la orden <strong>{{ formatClp(total()) }}</strong></p>
    <div class="actions">
      <button class="button secondary" type="button" (click)="loadExample()">Cargar ejemplo</button>
      <button class="button" type="submit" [disabled]="sending()">{{ sending() ? 'Creando…' : 'Crear orden' }}</button>
    </div>
  </div>

  @if (outcome(); as result) {
    <p class="outcome" [class.ok]="result.ok" [class.fail]="!result.ok" [attr.role]="result.ok ? 'status' : 'alert'">{{ result.text }}</p>
  }
</form>
