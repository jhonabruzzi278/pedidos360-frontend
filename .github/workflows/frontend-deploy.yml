name: frontend

# CI en cada push/PR (compila y ejecuta las pruebas). El despliegue en la EC2 (nginx) es manual, o
# automatico en push a main si la variable de repositorio AUTO_DEPLOY vale 'true'.
#
# Variables del repositorio para desplegar: ENTRA_CLIENT_ID, ENTRA_API_CLIENT_ID y ENTRA_TENANT_ID
# (o ENTRA_AUTHORITY para un tenant External ID); opcional ENTRA_SIGNUP_ENABLED=true para mostrar
# "Crear cuenta". Las URL de los API Gateway (jdv-api y jdv-web) y la instancia se descubren solas: las
# crea el workflow infra-deploy del repositorio backend.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test -- --no-watch

      - name: Compilar (con marcadores sin sustituir, solo valida que compila)
        run: npm run build

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: jdv-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descubrir la infraestructura
        run: |
          if ! ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"; then
            echo "::error::Credenciales invalidas o vencidas. Inicie el Learner Lab y ejecute infra/scripts/sync-aws-secrets.ps1 (repo backend)"
            exit 1
          fi
          API_URL="$(aws apigatewayv2 get-apis --query "Items[?Name=='jdv-api'] | [0].ApiEndpoint" --output text)"
          WEB_URL="$(aws apigatewayv2 get-apis --query "Items[?Name=='jdv-web'] | [0].ApiEndpoint" --output text)"
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=jdv-backend" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)"
          for value in "$API_URL" "$WEB_URL" "$INSTANCE_ID"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::No se encontro la infraestructura (jdv-api, jdv-web o la instancia jdv-backend). Ejecute primero infra-deploy en el repo backend."
              exit 1
            fi
          done
          {
            echo "BUCKET=jdv-artifacts-$ACCOUNT_ID"
            echo "INSTANCE_ID=$INSTANCE_ID"
            echo "FRONTEND_URL=$WEB_URL"
            echo "API_BASE_URL=$API_URL"
          } >> "$GITHUB_ENV"

      - run: npm ci

      - name: Configurar environment.production.ts
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
          ENTRA_SIGNUP_ENABLED: ${{ vars.ENTRA_SIGNUP_ENABLED }}
        run: node scripts/configure-environment.mjs

      - name: Compilar
        run: npm run build

      - name: Publicar el sitio en S3
        run: |
          tar -czf site.tar.gz -C dist/frontend/browser .
          aws s3 cp site.tar.gz "s3://$BUCKET/frontend/$GITHUB_SHA/site.tar.gz" --only-show-errors
          aws s3 cp site.tar.gz "s3://$BUCKET/frontend/latest/site.tar.gz" --only-show-errors

      - name: Esperar a que la instancia se registre en SSM
        run: |
          for _ in $(seq 1 60); do
            PING="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            [ "$PING" = "Online" ] && exit 0
            sleep 10
          done
          echo "::error::La instancia $INSTANCE_ID no aparece Online en SSM."
          exit 1

      - name: Publicar en nginx (SSM Run Command)
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{commands: ["cloud-init status --wait || true", "/opt/pedidos360/deploy-frontend.sh \($sha)"]}' > params.json
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "frontend-deploy $GITHUB_SHA" \
            --parameters file://params.json \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)"
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "Estado: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$STATUS" = "Success" ]

      - name: Resumen
        run: |
          {
            echo '## Frontend desplegado'
            echo "- URL: $FRONTEND_URL"
            echo "- API: $API_BASE_URL"
            echo "- Registre $FRONTEND_URL como URI de redireccion (SPA) en la aplicacion de Entra ID."
          } >> "$GITHUB_STEP_SUMMARY"
